<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#2e6452"/>
      <stop offset="0.52" stop-color="#183f35"/>
      <stop offset="1" stop-color="#0c221d"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".14"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1efe9"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6e1d3"/>
      <stop offset="1" stop-color="#d8d2c2"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f29a70"/>
      <stop offset="1" stop-color="#dc6a3f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".34"/>
    </filter>
    <filter id="pshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".3"/>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#fff" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
  </defs>

  <g filter="url(#shadow)">
    <rect x="74" y="74" width="876" height="876" rx="196" fill="url(#tile)"/>
    <rect x="74" y="74" width="876" height="876" rx="196" fill="url(#grid)"/>
    <rect x="74" y="74" width="876" height="876" rx="196" fill="url(#sheen)"/>
    <rect x="75.5" y="75.5" width="873" height="873" rx="194.5" fill="none" stroke="#fff" stroke-opacity=".09" stroke-width="3"/>
  </g>

  <!-- Back sheet -->
  <g transform="rotate(-7 592 600)" filter="url(#pshadow)">
    <rect x="360" y="250" width="470" height="650" rx="32" fill="url(#back)"/>
    <path d="M700 250h98v98z" fill="#c9c3b2"/>
    <rect x="414" y="440" width="300" height="30" rx="15" fill="#2b2a27" opacity=".14"/>
    <rect x="414" y="510" width="240" height="30" rx="15" fill="#2b2a27" opacity=".11"/>
  </g>

  <!-- Front sheet -->
  <g filter="url(#pshadow)">
    <rect x="486" y="310" width="510" height="690" rx="34" fill="url(#page)"/>
    <path d="M846 310h116v116z" fill="#cfcbc0"/>
    <rect x="548" y="490" width="330" height="36" rx="18" fill="#2b2a27" opacity=".88"/>
    <rect x="548" y="570" width="250" height="36" rx="18" fill="#2b2a27" opacity=".4"/>
    <rect x="548" y="650" width="300" height="36" rx="18" fill="#2b2a27" opacity=".3"/>
    <rect x="548" y="730" width="190" height="36" rx="18" fill="#2b2a27" opacity=".2"/>
  </g>

  <!-- Extension badge -->
  <g filter="url(#pshadow)">
    <circle cx="790" cy="790" r="132" fill="url(#badge)" stroke="#fff" stroke-opacity=".96" stroke-width="12"/>
    <text x="790" y="874" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="224" font-weight="700" fill="#fff">E</text>
  </g>
</svg>
